[package]
name = "agent"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
dll-syringe.workspace = true
protocol.workspace = true
camera.workspace = true
eldenring = { package = "eldenring", path = "../../../fromsoftware-rs/crates/eldenring" }
fromsoft-shared = { package = "fromsoftware-shared", path = "../../../fromsoftware-rs/crates/shared" }
eldenring-util = { package = "eldenring-util", path = "../../../fromsoftware-rs/crates/eldenring-util" }
pelite = { git = "https://github.com/lifegpc/pelite.git" }
log = "0.4"
log4rs = "1.3.0"
log-panics = { version = "2", features = ["with-backtrace"]}
retour = { version = "0.4.0-alpha.3", features = ["static-detour"] }
crossbeam = "0.8"
thiserror.workspace = true
gilrs.workspace = true
from-singleton = "2"
glam.workspace = true

[dependencies.windows]
version = "0.61.3"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
]

# https://github.com/CasualX/pelite/issues/287
[patch.crates-io]
pelite = { git = "https://github.com/lifegpc/pelite.git" }	