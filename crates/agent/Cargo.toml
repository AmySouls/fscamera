[package]
name = "agent"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
dll-syringe.workspace = true
protocol.workspace = true
eldenring = { path = "../../../chains-bindings/crates/eldenring" }
eldenring-util = { path = "../../../chains-bindings/crates/eldenring-util" }
dlrf = { package = "fromsoftware-dlrf", path = "../../../chains-bindings/crates/dlrf" }
fromsoft-shared = { package = "fromsoftware-shared", path = "../../../chains-bindings/crates/shared" }
log = "0.4"
log4rs = "1.3.0"
log-panics = { version = "2", features = ["with-backtrace"]}
pelite = "0.10"
retour = { git = "https://github.com/Hpmason/retour-rs.git", features = ["static-detour"] }
crossbeam = "0.8"
nalgebra.workspace = true
nalgebra-glm.workspace = true

[dependencies.windows]
version = "0.61.3"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
]
